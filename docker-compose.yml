version: '3.8'

services:
  app:
    # Build local ou imagem do Docker Hub
    build: .
    container_name: todo-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/todo_db
      - SPRING_DATASOURCE_USERNAME=todouser
      - SPRING_DATASOURCE_PASSWORD=todopassword
      # Ajuste crucial para Java em 1GB de RAM
      - JAVA_OPTS=-Xmx400m -Xms400m
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  db:
    image: postgres:16-alpine
    container_name: todo-db
    environment:
      - POSTGRES_DB=todo_db
      - POSTGRES_USER=todouser
      - POSTGRES_PASSWORD=todopassword
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todouser -d todo_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  postgres-data: